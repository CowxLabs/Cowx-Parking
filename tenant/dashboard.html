<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenant Dashboard — ParkPass</title>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/store.js"></script>
</head>
<body>

<script>__setTheme(window.__theme);</script>

<nav class="nav no-print">
  <a href="../index.html" class="nav-brand">&#x1F6A6; ParkPass</a>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="create-pass.html">New Pass</a>
    <a href="history.html">History</a>
    <a href="#" onclick="logout()" style="color:var(--danger);">Logout</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>My Passes</h1>
    <a href="create-pass.html" class="btn btn-primary">+ New Pass</a>
  </div>

  <div class="stats-grid" id="stats-row">
    <div class="stat-card"><div class="stat-value" id="stat-active">0</div><div class="stat-label">Active</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-today">0</div><div class="stat-label">Used Today</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 style="font-size:1rem;font-weight:600;">Active Passes</h2>
    </div>
    <div class="card-body" id="active-passes-list">
      <div class="text-center text-muted" style="padding:2rem 0;">No active passes.</div>
    </div>
  </div>
</div>

<script>
(function () {
  var user = getLoggedUser();
  if (!user || user.role !== 'tenant') { window.location.href = '../index.html'; return; }

  var tenantName = user.name;
  var passes = getTenantPasses(tenantName);

  var active = passes.filter(function (p) { return getStatus(p) === 'active'; });
  var today = passes.filter(function (p) {
    var d = new Date(p.createdAt);
    var now = new Date();
    return d.toDateString() === now.toDateString();
  });

  qs('#stat-active').textContent = active.length;
  qs('#stat-today').textContent = today.length;
  qs('#stat-total').textContent = passes.length;

  var list = qs('#active-passes-list');

  if (active.length === 0) {
    list.innerHTML =
      '<div class="empty-state">' +
        '<p>No active passes right now.</p>' +
        '<a href="create-pass.html" class="btn btn-primary">Create a Pass</a>' +
      '</div>';
  } else {
    list.innerHTML =
      '<div class="table-container"><table>' +
        '<thead><tr>' +
          '<th>Visitor</th><th>Plate</th><th>Spot</th><th>Expires</th><th>Pass ID</th><th></th>' +
        '</tr></thead><tbody>' +
        active.map(function (p) {
          var timeLeft = getTimeRemaining(p.expiresAt);
          return '<tr>' +
            '<td>' + p.visitorName + '</td>' +
            '<td>' + p.vehiclePlate + '</td>' +
            '<td>' + p.spot + '</td>' +
            '<td>' + formatDateShort(p.expiresAt) + ' <span class="text-muted">(' + timeLeft.hours + 'h ' + timeLeft.minutes + 'm)</span></td>' +
            '<td><code>' + p.id + '</code></td>' +
            '<td>' +
              '<a href="../visitor/pass.html?pid=' + p.id + '" class="btn btn-sm btn-outline">View</a> ' +
              '<button class="btn btn-sm btn-danger" onclick="revokePass(\'' + p.id + '\');location.reload();">Revoke</button>' +
            '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div>';
  }
})();
</script>

<footer class="footer">
  <span class="footer-text">// ParkPass v1.0 — local storage demo</span>
  <button class="theme-toggle" id="theme-toggle" onclick="__toggleTheme()">[DARK]</button>
</footer>

</body>
</html>
