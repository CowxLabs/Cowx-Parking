<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Pass — ParkPass</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/print.css">
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/store.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<script>__setTheme(window.__theme);</script>

<nav class="nav no-print">
  <a href="../index.html" class="nav-brand">&#x1F6A6; ParkPass</a>
  <div class="nav-links">
    <span id="nav-user" class="text-muted" style="font-size:0.875rem;"></span>
  </div>
</nav>

<div class="container" style="max-width:32rem;">
  <div id="pass-container">
    <div class="text-center text-muted" style="padding:3rem 0;">Loading pass...</div>
  </div>
</div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var pid = params.get('pid');

  if (!pid) {
    qs('#pass-container').innerHTML =
      '<div class="card"><div class="card-body text-center" style="padding:3rem;">' +
        '<p style="margin-bottom:1rem;">No pass ID provided.</p>' +
        '<a href="../index.html" class="btn btn-primary">Go Home</a>' +
      '</div></div>';
    return;
  }

  var pass = getPass(pid);

  if (!pass) {
    qs('#pass-container').innerHTML =
      '<div class="card"><div class="card-body text-center" style="padding:3rem;">' +
        '<p style="font-size:1.25rem;font-weight:700;margin-bottom:0.5rem;">Pass Not Found</p>' +
        '<p class="text-muted" style="margin-bottom:1rem;">No pass with ID <code>' + pid + '</code> exists.</p>' +
        '<a href="../index.html" class="btn btn-primary">Go Home</a>' +
      '</div></div>';
    return;
  }

  var user = getLoggedUser();
  if (user) {
    qs('#nav-user').textContent = user.name + (user.unit ? ' (Unit ' + user.unit + ')' : '');
  }

  var status = getStatus(pass);
  var badgeClass = status === 'active' ? 'badge-active' : status === 'expired' ? 'badge-expired' : 'badge-revoked';

  qs('#pass-container').innerHTML =
    '<div class="pass-card">' +
      '<h2>Visitor Parking Pass</h2>' +
      '<span class="badge ' + badgeClass + '" style="margin-bottom:1rem;display:inline-block;">' + status + '</span>' +
      '<div class="qr-container" id="qrcode"></div>' +
      '<div class="countdown" id="countdown">--:--:--</div>' +
      '<dl class="pass-details">' +
        '<dt>Pass ID</dt><dd><code>' + pass.id + '</code></dd>' +
        '<dt>Visitor</dt><dd>' + pass.visitorName + '</dd>' +
        '<dt>Vehicle Plate</dt><dd>' + pass.vehiclePlate + '</dd>' +
        '<dt>Parking Spot</dt><dd>' + pass.spot + '</dd>' +
        '<dt>Host</dt><dd>' + pass.tenantName + ' (Unit ' + pass.unit + ')</dd>' +
        '<dt>Issued</dt><dd>' + formatDate(pass.createdAt) + '</dd>' +
        '<dt>Expires</dt><dd>' + formatDate(pass.expiresAt) + '</dd>' +
      '</dl>' +
      '<div class="no-print" style="display:flex;gap:0.5rem;justify-content:center;">' +
        '<button class="btn btn-outline" onclick="window.print()">&#x1F5A8; Print</button>' +
        (user && user.role === 'tenant' ? '<a href="../tenant/dashboard.html" class="btn btn-primary">Back to Dashboard</a>' : '') +
      '</div>' +
    '</div>';

  new QRCode(qs('#qrcode'), {
    text: window.location.href,
    width: 180,
    height: 180,
    colorDark: getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#0f172a',
    colorLight: getComputedStyle(document.documentElement).getPropertyValue('--card-bg').trim() || '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });

  function updateCountdown() {
    var el = qs('#countdown');
    if (!el) return;
    var remaining = getTimeRemaining(pass.expiresAt);
    if (remaining.expired || status === 'expired' || status === 'revoked') {
      el.textContent = status === 'revoked' ? 'REVOKED' : 'EXPIRED';
      el.classList.add('expired');
      return;
    }
    var h = String(remaining.hours).padStart(2, '0');
    var m = String(remaining.minutes).padStart(2, '0');
    var s = String(remaining.seconds).padStart(2, '0');
    el.textContent = h + ':' + m + ':' + s;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
})();
</script>

<footer class="footer">
  <span class="footer-text">// ParkPass v1.0 — local storage demo</span>
  <button class="theme-toggle" id="theme-toggle" onclick="__toggleTheme()">[DARK]</button>
</footer>

</body>
</html>
